                  <div style={{ display:"flex", gap:8, flexWrap:"wrap", marginBottom:5 }}>
                    <span style={{ background:"rgba(92,160,50,0.15)", border:"1px solid rgba(92,160,50,0.25)", borderRadius:6, padding:"2px 8px", fontSize:11, color:"#a8d87a" }}>
                      📏 {df.amount}
                    </span>
                    <span style={{ background:"rgba(144,200,240,0.1)", border:"1px solid rgba(144,200,240,0.25)", borderRadius:6, padding:"2px 8px", fontSize:11, color:"#90d4f0" }}>
                      ⏰ {df.when}
                    </span>
                  </div>
                  <p style={{ margin:0, fontSize:12, color:"#c0d8a0", lineHeight:1.5 }}>✓ {df.why}</p>
                </div>
              </div>
            ))}
          </div>

          {/* Rules */}
          <div style={{
            marginTop:18,
            background:"rgba(255,80,80,0.06)",
            border:"1px solid rgba(255,80,80,0.2)",
            borderRadius:14, padding:"14px 16px",
          }}>
            <div style={{ fontSize:12, color:"#f08888", letterSpacing:2, textTransform:"uppercase", marginBottom:10 }}>
              ⚠ Golden Rules
            </div>
            {rules.map((r,i)=>(
              <div key={i} style={{ display:"flex", gap:8, marginBottom:8, alignItems:"flex-start" }}>
                <div style={{ color:"#f08888", fontSize:13, flexShrink:0, marginTop:1 }}>→</div>
                <p style={{ margin:0, fontSize:12, color:"#d0b8a0", lineHeight:1.5 }}>{r}</p>
              </div>
            ))}
          </div>

          {/* Daily dry fruit summary */}
          <div style={{
            marginTop:14,
            background:"rgba(255,200,60,0.06)",
            border:"1px solid rgba(255,200,60,0.2)",
            borderRadius:14, padding:"14px 16px",
          }}>
            <div style={{ fontSize:12, color:"#ffd060", letterSpacing:2, textTransform:"uppercase", marginBottom:10 }}>
              📊 Daily Dry Fruit Snapshot
            </div>
            <div style={{ display:"flex", gap:10, flexWrap:"wrap" }}>
              {[["~320","Total kcal","#ffd060"],["~10g","Extra protein","#90e070"],["~8g","Healthy fat","#f09060"],["~35g","Fibre + carbs","#f0c060"]].map(([v,l,c])=>(
                <div key={l} style={{ flex:"1 1 80px", textAlign:"center" }}>
                  <div style={{ fontSize:20, fontWeight:700, color:c }}>{v}</div>
                  <div style={{ fontSize:10, color:"#7a9a60" }}>{l}</div>
                </div>
              ))}
            </div>
          </div>
        </>)}

        <p style={{ textAlign:"center", marginTop:20, fontSize:10, color:"#4a6a34", lineHeight:1.7 }}>
          All dry fruit calories are included within your 1,900 kcal daily target.<br/>
          Consult a nutritionist for fully personalised advice.
        </p>
      </div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
if (typeof DietPlan !== 'undefined') root.render(<DietPlan />);
  else if (typeof App !== 'undefined') root.render(<App />);
  else if (typeof Main !== 'undefined') root.render(<Main />);
  else if (typeof Page !== 'undefined') root.render(<Page />);
  else if (typeof Home !== 'undefined') root.render(<Home />);
  else if (typeof Dashboard !== 'undefined') root.render(<Dashboard />);
</script>
</body>
</html>
